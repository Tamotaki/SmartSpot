<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartSpot Réservation</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body class="app-page">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon-sm">P<span class="logo-ping"><span class="logo-ping-core"></span></span></div>
    <div class="sidebar-brand-col">
      <span class="sidebar-brand"><span class="logo-smart">Smart</span><span class="logo-spot">Spot</span></span>
      <div class="sidebar-dashes">
        <span class="sidebar-dash"></span>
        <span class="sidebar-dash active"></span>
        <span class="sidebar-dash"></span>
      </div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <a href="/dashboard" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="/reservation" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Réservation</span>
    </a>
    <a href="/historique" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Historique</span>
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-info">
      <div class="user-avatar">{{ username[0].upper() if username else 'U' }}</div>
      <div>
        <p class="user-name">{{ username }}</p>
      </div>
    </div>
    <a href="/logout" class="btn-logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </a>
  </div>
</aside>

<!-- CONTENU PRINCIPAL -->
<main class="main-content">

  <header class="page-header">
    <div>
      <h1>Réserver une place</h1>
      <p class="page-subtitle">Choisissez une place disponible et définissez votre créneau</p>
    </div>
  </header>

  <!-- Sélection de place -->
  <section class="reservation-section">
    <h2 class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      Places disponibles
    </h2>

    <div class="places-grid" id="places-grid">
      <!-- Généré par JS -->
      <p class="loading-cell">Chargement des places…</p>
    </div>
  </section>

  <!-- Formulaire de réservation -->
  <section class="form-section" id="form-section" style="display:none">
    <h2 class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Choisir un créneau
    </h2>

    <div class="resa-form">
      <p class="resa-place-label">Place sélectionnée : <strong id="place-selected-label"></strong></p>
      <input type="hidden" id="place-id-input"/>

      <div class="form-row">
        <div class="form-group">
          <label for="heure-debut">Heure de début</label>
          <input type="datetime-local" id="heure-debut"/>
        </div>
        <div class="form-group">
          <label for="heure-fin">Heure de fin</label>
          <input type="datetime-local" id="heure-fin"/>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-secondary" onclick="annulerSelection()">Annuler</button>
        <button class="btn-primary" onclick="confirmerReservation()">Confirmer la réservation</button>
      </div>
    </div>
  </section>

  <!-- Message de confirmation -->
  <div id="resa-message" class="resa-message" style="display:none"></div>

</main>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/reservation.js') }}"></script>
</body>
</html>
